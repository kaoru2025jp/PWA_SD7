<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>計算アプリ 完成版</title>

<style>
body{
    font-family:sans-serif;
    max-width:460px;
    margin:auto;
    padding:16px;
    background:#f5f5f5;
    color:#333;
}

h2{
    text-align:center;
}

.description{
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
    margin-bottom:20px;
    line-height:1.8;
    font-size:14px;
}

.input-box{
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
}

.button-group{
    display:flex;
    gap:10px;
    margin-top:12px;
}

button{
    flex:1;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:0.2s;
}

.calc-btn{
    background:#222;
    color:white;
}

.calc-btn:hover{
    background:#111;
}

.reset-btn{
    background:#888;
    color:white;
}

.reset-btn:hover{
    background:#666;
}

button:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.loading-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.75);
    z-index:999;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.spinner{
    width:70px;
    height:70px;
    border:8px solid #ddd;
    border-top:8px solid #222;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.loading-text{
    margin-top:16px;
    font-size:16px;
    font-weight:bold;
    color:#333;
}

@keyframes spin{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}

.result{
    margin-top:20px;
    padding:12px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
}

.result h3{
    margin-top:0;
    text-align:center;
}

.slider-area{
    margin-top:20px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
}

.history{
    margin-top:20px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
}

.history h3{
    text-align:center;
}

.history-item{
    border-bottom:1px solid #ddd;
    padding:10px 0;
    font-size:14px;
}

.history-item:last-child{
    border-bottom:none;
}

.label{
    font-weight:bold;
}

.range-info{
    margin-top:8px;
    font-size:13px;
    color:#666;
}
</style>
</head>

<body>

<h2>計算アプリ</h2>

<div class="description">
政府証券と民間銘柄の交換差額を計算します。<br><br>

市場価格だけでなく、オプション価格を通じた調整メカニズムをシミュレーションできます。
</div>

<div class="input-box">

<input id="B" type="number" placeholder="B">
<input id="S" type="number" placeholder="S">
<input id="T1" type="number" placeholder="T1">
<input id="T2" type="number" placeholder="T2">

<hr>

<input id="S1" type="number" placeholder="S1">

<input
id="r"
type="number"
step="0.0001"
placeholder="r">

<input
id="TX3"
type="number"
step="0.0001"
placeholder="TX3">

</div>

<div class="button-group">

<button
id="calcBtn"
class="calc-btn"
onclick="calc()">
計算
</button>

<button
class="reset-btn"
onclick="resetForm()">
リセット
</button>

</div>

<div id="loadingOverlay" class="loading-overlay">

<div class="spinner"></div>

<div class="loading-text">
GAS通信中...
</div>

</div>

<div class="result">

<h3>計算結果</h3>

<div>
O1 :
<span id="O1">-</span>
</div>

<div>
O2 :
<span id="O2">-</span>
</div>

<hr>

<div>
<strong>
S - B + O1 + O2 :
</strong>
<span id="result">-</span>
</div>

<hr>

<div>
V1 :
<span id="V1">-</span>
</div>

<div>
V2 :
<span id="V2">-</span>
</div>

<hr>

<div>
V1 / V2 :
<span id="ratio1">-</span>
</div>

<div>
V2 / V1 :
<span id="ratio2">-</span>
</div>

<hr>

<div>
B1 :
<span id="B1">-</span>
</div>

<div>
B2 :
<span id="B2">-</span>
</div>

</div>

<div class="slider-area">

<h3>シミュレーション</h3>

<div>
現在の比率 :
<span id="sliderValue">1</span>
</div>

<input
type="range"
id="ratioSlider"
min="0.1"
max="2"
step="0.01"
value="1"
oninput="updateSimulation()"
style="width:100%;"
>

<div class="range-info">
V1/V2 ↔ V2/V1 の範囲を
スライダーでシミュレーションします。
</div>

</div>

<div class="history">

<h3>計算履歴</h3>

<div id="historyList">
履歴なし
</div>

</div>

<script>

/*
========================
GAS URL
========================
*/
const GAS_URL =
"https://script.google.com/macros/s/AKfycby3p9KLSlESfF-2BmPv7B4n995E2Gu4pNjhpitk-Y3Zfen6jvIAdbe63NTmajSxBbgz/exec";

let historyData = [];
let fixedB = 0;

/*
========================
小数点3桁関数
========================
*/
function formatNumber(value){

    if(
        isNaN(value) ||
        !isFinite(value)
    ){
        return "-";
    }

    return Number(value).toFixed(3);
}

/*
========================
計算
========================
*/
async function calc(){

    const B =
    Number(document.getElementById("B").value);

    const S =
    Number(document.getElementById("S").value);

    const T1 =
    Number(document.getElementById("T1").value);

    const T2 =
    Number(document.getElementById("T2").value);

    const S1 =
    Number(document.getElementById("S1").value);

    const r =
    Number(document.getElementById("r").value);

    const TX3 =
    Number(document.getElementById("TX3").value);

    if(
        isNaN(B) ||
        isNaN(S) ||
        isNaN(T1) ||
        isNaN(T2) ||
        isNaN(S1) ||
        isNaN(r) ||
        isNaN(TX3)
    ){
        alert("数値を入力してください");
        return;
    }

    fixedB = B;

    document.getElementById("loadingOverlay")
    .style.display = "flex";

    document.getElementById("calcBtn")
    .disabled = true;

    try{

        const res =
        await fetch(
            GAS_URL,
            {
                method:"POST",
                body:JSON.stringify({
                    B,
                    S,
                    T1,
                    T2
                })
            }
        );

        if(!res.ok){
            throw new Error("通信失敗");
        }

        const data =
        await res.json();

        const O1 =
        Number(data.O1);

        const O2 =
        Number(data.O2);

        const result =
        S - B + O1 + O2;

        document.getElementById("O1")
        .textContent = formatNumber(O1);

        document.getElementById("O2")
        .textContent = formatNumber(O2);

        document.getElementById("result")
        .textContent = formatNumber(result);

        /*
        ========================
        V計算
        ========================
        */
        const denominator =
        B - S1 * Math.exp(-r * TX3);

        const V1 =
        O1 / denominator;

        const V2 =
        O2 / denominator;

        document.getElementById("V1")
        .textContent = formatNumber(V1);

        document.getElementById("V2")
        .textContent = formatNumber(V2);

        /*
        比率
        */
        const ratio1 =
        V1 / V2;

        const ratio2 =
        V2 / V1;

        document.getElementById("ratio1")
        .textContent = formatNumber(ratio1);

        document.getElementById("ratio2")
        .textContent = formatNumber(ratio2);

        /*
        スライダー
        */
        const slider =
        document.getElementById("ratioSlider");

        slider.min =
        Math.min(ratio1, ratio2);

        slider.max =
        Math.max(ratio1, ratio2);

        slider.value =
        ratio1;

        updateSimulation();

        /*
        履歴
        */
        addHistory({
            B,
            S,
            T1,
            T2,
            O1,
            O2,
            result,
            V1,
            V2,
            ratio1,
            ratio2
        });

    }catch(error){

        console.error(error);

        alert(
            "GAS通信エラーが発生しました"
        );

    }finally{

        document.getElementById("loadingOverlay")
        .style.display = "none";

        document.getElementById("calcBtn")
        .disabled = false;
    }
}

/*
========================
シミュレーション
========================
*/
function updateSimulation(){

    const slider =
    document.getElementById("ratioSlider");

    const ratio =
    Number(slider.value);

    document.getElementById("sliderValue")
    .textContent =
    formatNumber(ratio);

    const B1 =
    fixedB * ratio;

    const B2 =
    fixedB * (1 / ratio);

    document.getElementById("B1")
    .textContent =
    formatNumber(B1);

    document.getElementById("B2")
    .textContent =
    formatNumber(B2);
}

/*
========================
リセット
========================
*/
function resetForm(){

    [
        "B",
        "S",
        "T1",
        "T2",
        "S1",
        "r",
        "TX3"
    ].forEach(id=>{

        document.getElementById(id)
        .value = "";

    });

    [
        "O1",
        "O2",
        "result",
        "V1",
        "V2",
        "ratio1",
        "ratio2",
        "B1",
        "B2"
    ].forEach(id=>{

        document.getElementById(id)
        .textContent = "-";

    });

    document.getElementById("sliderValue")
    .textContent = "1";
}

/*
========================
履歴
========================
*/
function addHistory(item){

    historyData.unshift(item);

    const historyList =
    document.getElementById("historyList");

    historyList.innerHTML = "";

    historyData.forEach((data,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "history-item";

        div.innerHTML = `

        <div>
        <span class="label">No:</span>
        ${index + 1}
        </div>

        <div>
        <span class="label">B:</span>
        ${formatNumber(data.B)}
        </div>

        <div>
        <span class="label">S:</span>
        ${formatNumber(data.S)}
        </div>

        <div>
        <span class="label">T1:</span>
        ${formatNumber(data.T1)}
        </div>

        <div>
        <span class="label">T2:</span>
        ${formatNumber(data.T2)}
        </div>

        <div>
        <span class="label">O1:</span>
        ${formatNumber(data.O1)}
        </div>

        <div>
        <span class="label">O2:</span>
        ${formatNumber(data.O2)}
        </div>

        <div>
        <span class="label">
        S-B+O1+O2:
        </span>
        ${formatNumber(data.result)}
        </div>

        <hr>

        <div>
        <span class="label">V1:</span>
        ${formatNumber(data.V1)}
        </div>

        <div>
        <span class="label">V2:</span>
        ${formatNumber(data.V2)}
        </div>

        <div>
        <span class="label">V1/V2:</span>
        ${formatNumber(data.ratio1)}
        </div>

        <div>
        <span class="label">V2/V1:</span>
        ${formatNumber(data.ratio2)}
        </div>
        `;

        historyList.appendChild(div);

    });
}

</script>

</body>
</html>
